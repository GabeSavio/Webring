<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dessert Personality Grid</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    /* square things i looked up */

    .body {
 background-color: #49350f;
    }   
    .square-box {
      aspect-ratio: 1 / 1;
      background-color: #635c4f;
      border: 3px solid #e8ba65;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* image square things i looked */
    .square-box img {
      width: 70%;
      height: 70%;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>
</head>

<body class="bg-light">

<div class="container mt-4">

  <h1 class="text-center display-4 mb-4">some tuff albums i love </h1>

  <div class="row g-4">


    <div class="col-12 col-md-6 col-lg-4">
      <div class="square-box text-center">
        <img src="mount eerie by the microphones (2003).jpg">
        <h4 class="mt-2">Mount Eerie</h4>
      </div>
    </div>


    <div class="col-12 col-md-6 col-lg-4">
      <div class="square-box text-center">
        <img src="black country, new road ants from up there (2022).jpg" >
        <h4 class="mt-2">ants from up there</h4>
      </div>
    </div>


    <div class="col-12 col-md-6 col-lg-4">
      <div class="square-box text-center">
        <img src="sade love deluxe.jpg" alt="Donut">
        <h4 class="mt-2">love deluxe </h4>
      </div>
    </div>


    <div class="col-12 col-md-6 col-lg-4">
      <div class="square-box text-center">
        <img src="_Spacy_ from Tatsuro Yamashita_  Super hard to find.  I went to little tokyo here in L.A. and had a little store order it for me, so exited to listen!" >
        <h4 class="mt-2">Spacy</h4>
      </div>
    </div>


    <div class="col-12 col-md-6 col-lg-4">
      <div class="square-box text-center">
        <img src="pink moon.jpg" >
        <h4 class="mt-2">Pink Moon</h4>
      </div>
    </div>

    <!-- Card 6 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="square-box text-center">
        <img src="˙✧˖°🫀 ⋆｡˚꩜.jpg" >
        <h4 class="mt-2">LSD and the Search for God</h4>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
